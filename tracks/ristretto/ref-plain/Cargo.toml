[package]
name = "ristretto-ref"
version = "0.1.0"
edition = "2021"

[dependencies]
hacspec-lib = { path = "../../x25519/hacspec-old/lib" }

[dev-dependencies]
# The unchanged spec, for differential tests of the port.
hacspec-ristretto = { path = "../../x25519/hacspec-specs/ristretto" }
hacspec-edwards25519 = { path = "../../x25519/hacspec-specs/edwards25519" }
# The real code that libsignal fc90b90f uses, for differential tests.
curve25519-dalek = "=5.0.0"

[patch."https://github.com/hacspec/hacspec.git"]
hacspec-lib = { path = "../../x25519/hacspec-old/lib" }

[workspace]

# The tests run about 2300 scalar multiplications with hacspec big integers. Optimized code
# makes them about ten times faster. Overflow checks stay on.
[profile.dev]
opt-level = 3
